ListIncomesFilters:
  type: object
  properties:
    startDate:
      type: string
      description: "Data de início (formato: YYYY-MM-DD)"
    endDate:
      type: string
      description: "Data de fim (formato: YYYY-MM-DD)"

Income:
  type: object
  required:
    - id
    - clientId
    - financialInstrumentId
    - description
    - amount
    - reference
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    clientId:
      type: string
      format: uuid
      description: "Client identifier"
    financialInstrumentId:
      type: string
      format: uuid
    description:
      type: string
    amount:
      type: string
      description: "Decimal value as string"
    reference:
      type: string
      description: "Reference date (YYYY-MM-DD)"
    createdAt:
      type: string
      description: "DateTime string"
    updatedAt:
      type: string
      nullable: true
      description: "DateTime string"

CreateIncomeRequest:
  type: object
  required:
    - financialInstrumentIdentification
    - description
    - amount
    - dateReference
  properties:
    financialInstrumentIdentification:
      type: string
      description: "Financial instrument identification"
    description:
      type: string
      description: "Income description"
    amount:
      type: string
      description: "Decimal value as string"
    dateReference:
      type: string
      description: "Reference date (YYYY-MM-DD)"
