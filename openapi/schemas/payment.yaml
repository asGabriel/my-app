ListPaymentsFilters:
  type: object
  properties:
    debtIds:
      type: array
      items:
        type: string
        format: uuid
      description: "Lista de IDs de dívidas para filtrar"
    accountIds:
      type: array
      items:
        type: string
        format: uuid
      description: "Lista de IDs de contas para filtrar"
    startDate:
      type: string
      description: "Data de início (formato: YYYY-MM-DD)"
    endDate:
      type: string
      description: "Data de fim (formato: YYYY-MM-DD)"

Payment:
  type: object
  required:
    - id
    - clientId
    - debtId
    - accountId
    - amount
    - paymentDate
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: "Unique identifier"
    clientId:
      type: string
      format: uuid
      description: "Client identifier"
    debtId:
      type: string
      format: uuid
      description: "Unique identifier of the debt"
    accountId:
      type: string
      format: uuid
      description: "Unique identifier of the account (conta de pagamento)"
    amount:
      type: string
      description: "Decimal value as string"
    paymentDate:
      type: string
      description: "Payment date (YYYY-MM-DD)"
    createdAt:
      type: string
      description: "DateTime string"
    updatedAt:
      type: string
      nullable: true
      description: "DateTime string"

CreatePaymentRequest:
  type: object
  required:
    - debtId
    - paymentDate
  properties:
    debtId:
      type: string
      format: uuid
      description: "Unique identifier of the debt to pay"
    accountId:
      type: string
      format: uuid
      description: "Unique identifier of the account"
      nullable: true
    paymentDate:
      type: string
      description: "Payment date (YYYY-MM-DD)"
    amount:
      type: string
      description: "Decimal value as string (optional, uses debt remaining amount if not provided)"
      nullable: true
    reconcile:
      type: boolean
      description: "Whether to reconcile the debt with this payment amount"
      nullable: true
