GoogleLoginRequest:
  type: object
  required:
    - idToken
  properties:
    idToken:
      type: string
      description: "ID token (credential) retornado pelo Google Identity Services"

Role:
  type: string
  description: Papel do usuário na allowlist
  enum:
    - admin
    - member

UserResponse:
  type: object
  required:
    - id
    - email
    - name
    - tenantId
    - role
    - lastLoginAt
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    name:
      type: string
    avatarUrl:
      type: string
      nullable: true
    tenantId:
      type: string
      format: uuid
      description: "Tenant dono dos dados (client_id no finance)"
    role:
      $ref: "#/Role"
    lastLoginAt:
      type: string
      format: date-time

AuthResponse:
  type: object
  required:
    - token
    - user
  properties:
    token:
      type: string
    user:
      $ref: "#/UserResponse"
