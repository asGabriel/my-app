ListIncomesFilters:
  type: object
  properties:
    financialInstrumentIds:
      type: array
      items:
        type: string
        format: uuid
      description: "Lista de IDs de instrumentos financeiros (contas) para filtrar"
    startDate:
      type: string
      description: "Data de início (formato: YYYY-MM-DD)"
    endDate:
      type: string
      description: "Data de fim (formato: YYYY-MM-DD)"

Income:
  type: object
  required:
    - id
    - clientId
    - description
    - amount
    - reference
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    clientId:
      type: string
      format: uuid
      description: "Client identifier"
    financialInstrumentId:
      type: string
      format: uuid
      nullable: true
    description:
      type: string
    amount:
      type: string
      description: "Decimal value as string"
    reference:
      type: string
      description: "Reference date (YYYY-MM-DD)"
    createdAt:
      type: string
      description: "DateTime string"
    updatedAt:
      type: string
      nullable: true
      description: "DateTime string"

CreateIncomeRequest:
  type: object
  required:
    - financialInstrumentId
    - description
    - amount
    - dateReference
  properties:
    financialInstrumentId:
      type: string
      format: uuid
      description: "ID do instrumento financeiro"
    description:
      type: string
      description: "Descrição da receita"
    amount:
      type: string
      description: "Valor (decimal como string)"
    dateReference:
      type: string
      description: "Data de referência (YYYY-MM-DD)"
