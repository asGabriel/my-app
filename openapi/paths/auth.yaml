google:
  post:
    operationId: loginWithGoogle
    summary: Troca um ID token do Google pelo token da API
    description: >
      Só e-mails presentes na allowlist (auth.allowed_users) conseguem entrar.
    tags:
      - Auth
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth.yaml#/GoogleLoginRequest"
    responses:
      "200":
        description: Login realizado com sucesso
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/AuthResponse"
      "401":
        description: ID token do Google inválido ou expirado
      "403":
        description: E-mail fora da allowlist

me:
  get:
    operationId: getMe
    summary: Retorna os dados do usuário autenticado
    tags:
      - Auth
    responses:
      "200":
        description: Dados do usuário
        content:
          application/json:
            schema:
              $ref: "../schemas/auth.yaml#/UserResponse"
      "401":
        description: Não autenticado
