list:
  post:
    operationId: listPayments
    summary: Lista os pagamentos do período
    description: Lista pagamentos com filtros por período, débitos, instrumentos financeiros e contas.
    tags:
      - Payment
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/payment.yaml#/ListPaymentsFilters"
          example:
            accountIds:
              - "1f687ce9-034a-4e72-8268-7db5f9989474"
            startDate: "2026-02-01"
            endDate: "2026-02-29"
    responses:
      "200":
        description: Lista de pagamentos
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/payment.yaml#/Payment"

create:
  post:
    operationId: createPayment
    summary: Cria um novo pagamento
    tags:
      - Payment
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/payment.yaml#/CreatePaymentRequest"
    responses:
      "201":
        description: Pagamento criado com sucesso
        content:
          application/json:
            schema:
              $ref: "../schemas/payment.yaml#/Payment"
