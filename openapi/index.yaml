openapi: 3.0.3
info:
  title: Finance Manager API
  version: 1.0.0
  description: API para gerenciamento financeiro

servers:
  - url: "{apiUrl}/api"
    description: API Server
    variables:
      apiUrl:
        default: http://localhost:5173
        description: Base URL from VITE_API_URL env var

paths:
  /auth/login:
    $ref: "./paths/auth.yaml#/login"
  /auth/register:
    $ref: "./paths/auth.yaml#/register"
  /auth/me:
    $ref: "./paths/auth.yaml#/me"
  # financeManager: sem cobertura por hora — backend em reformulação (v2).
  # O novo módulo `finance` (rust-api) volta aos poucos: por ora a listagem
  # de dívidas, edição de dívida e listas (agrupadores). Ver openapi/paths/finance.yaml e
  # matchmaking.yaml para o padrão.
  /finance/debt/list:
    $ref: "./paths/finance.yaml#/listDebts"
  /finance/debt/{debtId}:
    $ref: "./paths/finance.yaml#/updateDebt"
  /finance/list:
    $ref: "./paths/finance.yaml#/lists"
  /matchmaking/players/:
    $ref: "./paths/matchmaking.yaml#/players"
  /matchmaking/players/{playerId}:
    $ref: "./paths/matchmaking.yaml#/updatePlayer"
  /matchmaking/sessions/:
    $ref: "./paths/matchmaking.yaml#/sessions"
  /matchmaking/sessions/{sessionId}:
    $ref: "./paths/matchmaking.yaml#/session"
  /matchmaking/sessions/{sessionId}/check-in/{playerId}:
    $ref: "./paths/matchmaking.yaml#/checkIn"
  /matchmaking/sessions/{sessionId}/queue:
    $ref: "./paths/matchmaking.yaml#/sessionQueue"
  /matchmaking/sessions/{sessionId}/queue/fill:
    $ref: "./paths/matchmaking.yaml#/fillCourts"
  /matchmaking/sessions/{sessionId}/queue/{playerId}:
    $ref: "./paths/matchmaking.yaml#/pinQueuePlayer"
  /matchmaking/teams/:
    $ref: "./paths/matchmaking.yaml#/teams"
  /matchmaking/teams/{sessionId}:
    $ref: "./paths/matchmaking.yaml#/teamsBySession"
  /matchmaking/teams/{teamId}:
    $ref: "./paths/matchmaking.yaml#/deleteTeam"
  /matchmaking/teams/{teamId}/players:
    $ref: "./paths/matchmaking.yaml#/updateTeam"
  /matchmaking/matches/:
    $ref: "./paths/matchmaking.yaml#/matches"
  /matchmaking/matches/{sessionId}:
    $ref: "./paths/matchmaking.yaml#/matchesBySession"
  /matchmaking/matches/{matchId}/result:
    $ref: "./paths/matchmaking.yaml#/matchResult"

components:
  schemas:
    LoginRequest:
      $ref: "./schemas/auth.yaml#/LoginRequest"
    RegisterRequest:
      $ref: "./schemas/auth.yaml#/RegisterRequest"
    UserResponse:
      $ref: "./schemas/auth.yaml#/UserResponse"
    AuthResponse:
      $ref: "./schemas/auth.yaml#/AuthResponse"
    DebtStatus:
      $ref: "./schemas/finance.yaml#/DebtStatus"
    DebtCategory:
      $ref: "./schemas/finance.yaml#/DebtCategory"
    ExpenseType:
      $ref: "./schemas/finance.yaml#/ExpenseType"
    Debt:
      $ref: "./schemas/finance.yaml#/Debt"
    DebtFilters:
      $ref: "./schemas/finance.yaml#/DebtFilters"
    DebtList:
      $ref: "./schemas/finance.yaml#/DebtList"
    CreateDebtListRequest:
      $ref: "./schemas/finance.yaml#/CreateDebtListRequest"
    UpdateDebtRequest:
      $ref: "./schemas/finance.yaml#/UpdateDebtRequest"
    Gender:
      $ref: "./schemas/matchmaking.yaml#/Gender"
    GameMode:
      $ref: "./schemas/matchmaking.yaml#/GameMode"
    TeamStatus:
      $ref: "./schemas/matchmaking.yaml#/TeamStatus"
    Player:
      $ref: "./schemas/matchmaking.yaml#/Player"
    CreatePlayerRequest:
      $ref: "./schemas/matchmaking.yaml#/CreatePlayerRequest"
    UpdatePlayerRequest:
      $ref: "./schemas/matchmaking.yaml#/UpdatePlayerRequest"
    SessionSettings:
      $ref: "./schemas/matchmaking.yaml#/SessionSettings"
    Session:
      $ref: "./schemas/matchmaking.yaml#/Session"
    CreateSessionRequest:
      $ref: "./schemas/matchmaking.yaml#/CreateSessionRequest"
    UpdateSessionRequest:
      $ref: "./schemas/matchmaking.yaml#/UpdateSessionRequest"
    Team:
      $ref: "./schemas/matchmaking.yaml#/Team"
    CreateTeamRequest:
      $ref: "./schemas/matchmaking.yaml#/CreateTeamRequest"
    UpdateTeamRequest:
      $ref: "./schemas/matchmaking.yaml#/UpdateTeamRequest"
    Match:
      $ref: "./schemas/matchmaking.yaml#/Match"
    CreateMatchRequest:
      $ref: "./schemas/matchmaking.yaml#/CreateMatchRequest"
    ReportMatchResultRequest:
      $ref: "./schemas/matchmaking.yaml#/ReportMatchResultRequest"
    ReportMatchResultResponse:
      $ref: "./schemas/matchmaking.yaml#/ReportMatchResultResponse"
    QueueEntry:
      $ref: "./schemas/matchmaking.yaml#/QueueEntry"
    CourtSuggestion:
      $ref: "./schemas/matchmaking.yaml#/CourtSuggestion"
    SetPinRequest:
      $ref: "./schemas/matchmaking.yaml#/SetPinRequest"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
