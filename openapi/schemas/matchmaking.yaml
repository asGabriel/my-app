Gender:
  type: string
  enum:
    - male
    - female

GameMode:
  type: string
  enum:
    - male
    - female
    - mixed
    - open

TeamStatus:
  type: string
  enum:
    - draft
    - holding
    - playing
    - disbanded

Player:
  type: object
  required:
    - id
    - name
    - gender
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    gender:
      $ref: "#/Gender"
    createdAt:
      type: string
      description: "DateTime string (RFC3339)"
    updatedAt:
      type: string
      nullable: true
      description: "DateTime string (RFC3339)"

CreatePlayerRequest:
  type: object
  required:
    - name
    - gender
  properties:
    name:
      type: string
    gender:
      $ref: "#/Gender"

UpdatePlayerRequest:
  type: object
  properties:
    name:
      type: string
      nullable: true
    gender:
      $ref: "#/Gender"
      nullable: true

SessionSettings:
  type: object
  required:
    - playersPerTeam
    - setsToWin
    - pointsPerSet
  properties:
    playersPerTeam:
      type: integer
      description: "Jogadores por time (padrão 2)"
    setsToWin:
      type: integer
      description: "Sets necessários para vencer a partida (padrão 2)"
    pointsPerSet:
      type: integer
      description: "Pontos por set (padrão 21)"

Session:
  type: object
  required:
    - id
    - date
    - settings
    - availableCourts
    - gameMode
    - playerIds
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    date:
      type: string
      description: "Data do dia de jogo (YYYY-MM-DD)"
    description:
      type: string
      nullable: true
      description: "Título opcional para identificar a sessão"
    settings:
      $ref: "#/SessionSettings"
    availableCourts:
      type: integer
    gameMode:
      $ref: "#/GameMode"
    playerIds:
      type: array
      items:
        type: string
        format: uuid
    createdAt:
      type: string
      description: "DateTime string (RFC3339)"
    updatedAt:
      type: string
      nullable: true
      description: "DateTime string (RFC3339)"

CreateSessionRequest:
  type: object
  required:
    - date
    - availableCourts
    - gameMode
  properties:
    date:
      type: string
      description: "Data do dia de jogo (YYYY-MM-DD)"
    description:
      type: string
      nullable: true
      description: "Título opcional para identificar a sessão"
    availableCourts:
      type: integer
    gameMode:
      $ref: "#/GameMode"
    settings:
      $ref: "#/SessionSettings"
      nullable: true

UpdateSessionRequest:
  type: object
  properties:
    date:
      type: string
      nullable: true
    description:
      type: string
      nullable: true
      description: "Título opcional para identificar a sessão"
    availableCourts:
      type: integer
      nullable: true
    gameMode:
      $ref: "#/GameMode"
      nullable: true
    settings:
      $ref: "#/SessionSettings"
      nullable: true
    playerIds:
      type: array
      items:
        type: string
        format: uuid
      nullable: true

Team:
  type: object
  required:
    - id
    - sessionId
    - playerIds
    - status
    - consecutiveWins
    - court
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    sessionId:
      type: string
      format: uuid
    playerIds:
      type: array
      items:
        type: string
        format: uuid
    status:
      $ref: "#/TeamStatus"
    consecutiveWins:
      type: integer
    court:
      type: integer
      nullable: true
      description: "Quadra da qual esse Draft é o próximo desafiante (null num Draft manual, ou quando o time já está Playing/Holding)"
    createdAt:
      type: string
      description: "DateTime string (RFC3339)"

QueueEntry:
  type: object
  required:
    - id
    - sessionId
    - playerId
    - gamesPlayed
    - enqueuedAt
    - pinned
    - pinnedAt
  properties:
    id:
      type: string
      format: uuid
    sessionId:
      type: string
      format: uuid
    playerId:
      type: string
      format: uuid
    gamesPlayed:
      type: integer
      description: "Partidas que o jogador já terminou nessa sessão"
    enqueuedAt:
      type: string
      description: "DateTime string (RFC3339); vira agora toda vez que o jogador (re)entra na lista"
    pinned:
      type: boolean
      description: "Jogador fixado no topo da fila (prioridade manual)"
    pinnedAt:
      type: string
      nullable: true
      description: "DateTime string (RFC3339); null quando não fixado"

CourtSuggestion:
  type: object
  required:
    - court
    - holdingTeamId
    - draftTeamIds
    - missingChallenger
  properties:
    court:
      type: integer
    holdingTeamId:
      type: string
      format: uuid
      nullable: true
      description: "Time que venceu e está segurando essa quadra (null se a quadra abre com 2 times novos)"
    draftTeamIds:
      type: array
      items:
        type: string
        format: uuid
      description: "Draft(s) sugeridos pra essa quadra — o operador confirma, edita ou descarta"
    missingChallenger:
      type: boolean
      description: "A fila não tinha jogadores suficientes (ex.: gênero desbalanceado no Misto) pra formar o desafiante — quadra fica ociosa até montar manual ou a fila encher"

ReportMatchResultResponse:
  type: object
  required:
    - match
    - courts
  properties:
    match:
      $ref: "#/Match"
    courts:
      type: array
      items:
        $ref: "#/CourtSuggestion"

SetPinRequest:
  type: object
  required:
    - pinned
  properties:
    pinned:
      type: boolean

CreateTeamRequest:
  type: object
  required:
    - sessionId
    - playerIds
  properties:
    sessionId:
      type: string
      format: uuid
    playerIds:
      type: array
      items:
        type: string
        format: uuid

UpdateTeamRequest:
  type: object
  required:
    - playerIds
  properties:
    playerIds:
      type: array
      items:
        type: string
        format: uuid

Match:
  type: object
  required:
    - id
    - sessionId
    - court
    - teamAId
    - teamBId
    - winnerTeamId
    - startedAt
    - playedAt
  properties:
    id:
      type: string
      format: uuid
    sessionId:
      type: string
      format: uuid
    court:
      type: integer
    teamAId:
      type: string
      format: uuid
    teamBId:
      type: string
      format: uuid
    winnerTeamId:
      type: string
      format: uuid
      nullable: true
      description: "Null enquanto a partida está em andamento"
    startedAt:
      type: string
      description: "DateTime string (RFC3339)"
    playedAt:
      type: string
      nullable: true
      description: "DateTime string (RFC3339); null enquanto a partida está em andamento"

CreateMatchRequest:
  type: object
  required:
    - sessionId
    - court
    - teamAId
    - teamBId
  properties:
    sessionId:
      type: string
      format: uuid
    court:
      type: integer
    teamAId:
      type: string
      format: uuid
    teamBId:
      type: string
      format: uuid

ReportMatchResultRequest:
  type: object
  required:
    - winnerTeamId
  properties:
    winnerTeamId:
      type: string
      format: uuid
