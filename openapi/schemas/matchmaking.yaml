Gender:
  type: string
  enum:
    - male
    - female

GameMode:
  type: string
  enum:
    - male
    - female
    - mixed
    - open

ShuffleType:
  type: string
  enum:
    - kingAndQueen
    - roundRobin

TeamStatus:
  type: string
  enum:
    - waiting
    - holding
    - disbanded

Player:
  type: object
  required:
    - id
    - name
    - gender
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    gender:
      $ref: "#/Gender"
    createdAt:
      type: string
      description: "DateTime string (RFC3339)"
    updatedAt:
      type: string
      nullable: true
      description: "DateTime string (RFC3339)"

CreatePlayerRequest:
  type: object
  required:
    - name
    - gender
  properties:
    name:
      type: string
    gender:
      $ref: "#/Gender"

UpdatePlayerRequest:
  type: object
  properties:
    name:
      type: string
      nullable: true
    gender:
      $ref: "#/Gender"
      nullable: true

SessionSettings:
  type: object
  required:
    - playersPerTeam
    - setsToWin
    - pointsPerSet
  properties:
    playersPerTeam:
      type: integer
      description: "Jogadores por time (padrão 2)"
    setsToWin:
      type: integer
      description: "Sets necessários para vencer a partida (padrão 2)"
    pointsPerSet:
      type: integer
      description: "Pontos por set (padrão 21)"

Session:
  type: object
  required:
    - id
    - date
    - settings
    - availableCourts
    - gameMode
    - shuffleType
    - playerIds
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    date:
      type: string
      description: "Data do dia de jogo (YYYY-MM-DD)"
    settings:
      $ref: "#/SessionSettings"
    availableCourts:
      type: integer
    gameMode:
      $ref: "#/GameMode"
    shuffleType:
      $ref: "#/ShuffleType"
    playerIds:
      type: array
      items:
        type: string
        format: uuid
    createdAt:
      type: string
      description: "DateTime string (RFC3339)"
    updatedAt:
      type: string
      nullable: true
      description: "DateTime string (RFC3339)"

CreateSessionRequest:
  type: object
  required:
    - date
    - availableCourts
    - gameMode
    - shuffleType
  properties:
    date:
      type: string
      description: "Data do dia de jogo (YYYY-MM-DD)"
    availableCourts:
      type: integer
    gameMode:
      $ref: "#/GameMode"
    shuffleType:
      $ref: "#/ShuffleType"
    settings:
      $ref: "#/SessionSettings"
      nullable: true

UpdateSessionRequest:
  type: object
  properties:
    date:
      type: string
      nullable: true
    availableCourts:
      type: integer
      nullable: true
    gameMode:
      $ref: "#/GameMode"
      nullable: true
    shuffleType:
      $ref: "#/ShuffleType"
      nullable: true
    settings:
      $ref: "#/SessionSettings"
      nullable: true
    playerIds:
      type: array
      items:
        type: string
        format: uuid
      nullable: true

Team:
  type: object
  required:
    - id
    - sessionId
    - playerIds
    - status
    - consecutiveWins
    - priority
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    sessionId:
      type: string
      format: uuid
    playerIds:
      type: array
      items:
        type: string
        format: uuid
    status:
      $ref: "#/TeamStatus"
    consecutiveWins:
      type: integer
    priority:
      type: boolean
      description: "Time marcado para jogar em seguida (entrada manual de próximo), ignorando a ordem normal da fila"
    createdAt:
      type: string
      description: "DateTime string (RFC3339)"

CreateTeamRequest:
  type: object
  required:
    - sessionId
    - playerIds
  properties:
    sessionId:
      type: string
      format: uuid
    playerIds:
      type: array
      items:
        type: string
        format: uuid

Match:
  type: object
  required:
    - id
    - sessionId
    - court
    - teamAId
    - teamBId
    - winnerTeamId
    - startedAt
    - playedAt
  properties:
    id:
      type: string
      format: uuid
    sessionId:
      type: string
      format: uuid
    court:
      type: integer
    teamAId:
      type: string
      format: uuid
    teamBId:
      type: string
      format: uuid
    winnerTeamId:
      type: string
      format: uuid
      nullable: true
      description: "Null enquanto a partida está em andamento"
    startedAt:
      type: string
      description: "DateTime string (RFC3339)"
    playedAt:
      type: string
      nullable: true
      description: "DateTime string (RFC3339); null enquanto a partida está em andamento"

CreateMatchRequest:
  type: object
  required:
    - sessionId
    - court
    - teamAId
    - teamBId
  properties:
    sessionId:
      type: string
      format: uuid
    court:
      type: integer
    teamAId:
      type: string
      format: uuid
    teamBId:
      type: string
      format: uuid

ReportMatchResultRequest:
  type: object
  required:
    - winnerTeamId
  properties:
    winnerTeamId:
      type: string
      format: uuid
