DebtCategory:
  type: string
  enum:
    - UNKNOWN
    - HOME
    - TRANSPORT
    - HEALTH
    - FOOD
    - LIFESTYLE
    - EDUCATION
    - GOALS
    - PERSONAL

DebtStatus:
  type: string
  enum:
    - OPEN
    - INSTALLMENT
    - SETTLED

ExpenseType:
  type: string
  enum:
    - FIXED
    - VARIABLE

CreateDebtRequest:
  type: object
  required:
    - description
    - dueDate
    - totalAmount
    - isPaid
  properties:
    category:
      type: string
      description: "Categoria do débito"
    tags:
      type: array
      items:
        type: string
      description: "Tags para identificar o débito"
    description:
      type: string
      description: "Descrição do débito"
    dueDate:
      type: string
      description: "Data de vencimento (YYYY-MM-DD)"
    totalAmount:
      type: string
      description: "Valor total do débito"
    paidAmount:
      type: string
      description: "Valor já pago"
    discountAmount:
      type: string
      description: "Valor de desconto"
    status:
      $ref: "#/DebtStatus"
      description: "Status do débito"
    isPaid:
      type: boolean
      description: "Se o débito já foi pago"
    financialInstrumentId:
      type: string
      format: uuid
      description: "ID do instrumento financeiro"
    installmentCount:
      type: integer
      description: "Número de parcelas"
    expenseType:
      $ref: "#/ExpenseType"
      nullable: true
      description: "Tipo de despesa"

DebtFilters:
  type: object
  properties:
    ids:
      type: array
      items:
        type: string
        format: uuid
      description: "Lista de IDs de dívidas para filtrar"
    statuses:
      type: array
      items:
        $ref: "#/DebtStatus"
      description: "Lista de status para filtrar"
    startDate:
      type: string
      description: "Data de início (formato: YYYY-MM-DD)"
    endDate:
      type: string
      description: "Data de fim (formato: YYYY-MM-DD)"

Debt:
  type: object
  required:
    - id
    - clientId
    - category
    - tags
    - identification
    - description
    - totalAmount
    - paidAmount
    - discountAmount
    - remainingAmount
    - dueDate
    - status
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: "Unique identifier"
    clientId:
      type: string
      format: uuid
      description: "Client identifier"
    category:
      type: string
      description: "The category of the debt"
    tags:
      type: array
      items:
        type: string
      description: "Tags that identify the debt"
    identification:
      type: string
      description: "Human readable identification"
    description:
      type: string
      description: "The description of the debt"
    totalAmount:
      type: string
      description: "Decimal value as string"
    paidAmount:
      type: string
      description: "Decimal value as string"
    discountAmount:
      type: string
      description: "Decimal value as string"
    remainingAmount:
      type: string
      description: "Decimal value as string"
    dueDate:
      type: string
      description: "Due date (YYYY-MM-DD)"
    status:
      $ref: "#/DebtStatus"
      description: "The status of the debt"
    installmentCount:
      type: integer
      nullable: true
      description: "The number of installments"
    expenseType:
      $ref: "#/ExpenseType"
      description: "The expense type"
    createdAt:
      type: string
      description: "DateTime string"
    updatedAt:
      type: string
      nullable: true
      description: "DateTime string"

InstallmentFilters:
  type: object
  properties:
    debtIds:
      type: array
      items:
        type: string
        format: uuid
      description: "Lista de IDs de débitos para filtrar parcelas"
    isPaid:
      type: boolean
      description: "Filtrar por parcelas pagas ou não pagas"
    startDate:
      type: string
      description: "Data de início (formato: YYYY-MM-DD)"
    endDate:
      type: string
      description: "Data de fim (formato: YYYY-MM-DD)"

Installment:
  type: object
  required:
    - debtId
    - installmentId
    - dueDate
    - amount
    - isPaid
    - createdAt
  properties:
    debtId:
      type: string
      format: uuid
      description: "ID do débito"
    installmentId:
      type: integer
      description: "Número da parcela"
    dueDate:
      type: string
      description: "Data de vencimento (YYYY-MM-DD)"
    amount:
      type: string
      description: "Valor da parcela"
    isPaid:
      type: boolean
      description: "Se a parcela foi paga"
    paymentId:
      type: string
      format: uuid
      nullable: true
      description: "ID do pagamento (se pago)"
    createdAt:
      type: string
      description: "DateTime string"
    updatedAt:
      type: string
      nullable: true
      description: "DateTime string"

UpdateDebtRequest:
  type: object
  properties:
    category:
      $ref: "#/DebtCategory"
      nullable: true
      description: "Categoria do débito"
    expenseType:
      $ref: "#/ExpenseType"
      nullable: true
      description: "Tipo de despesa"
    tags:
      type: array
      items:
        type: string
      nullable: true
      description: "Tags do débito"
    description:
      type: string
      nullable: true
      description: "Descrição do débito"
    dueDate:
      type: string
      nullable: true
      description: "Data de vencimento (YYYY-MM-DD)"

CreateRecurrenceRequest:
  type: object
  required:
    - description
    - amount
    - startDate
    - dayOfMonth
  properties:
    financialInstrumentId:
      type: string
      format: uuid
      nullable: true
      description: "ID do instrumento financeiro"
    description:
      type: string
      description: "Descrição da recorrência"
    amount:
      type: string
      description: "Valor da recorrência (Decimal)"
    startDate:
      type: string
      description: "Data de início (YYYY-MM-DD)"
    endDate:
      type: string
      nullable: true
      description: "Data de término (YYYY-MM-DD)"
    dayOfMonth:
      type: integer
      description: "Dia do mês para a recorrência"
    category:
      $ref: "#/DebtCategory"
      nullable: true
      description: "Categoria da recorrência (opcional)"

RecurrenceFilters:
  type: object
  properties:
    clientId:
      type: string
      format: uuid
      nullable: true
      description: "ID do cliente"
    nextRunDate:
      type: string
      nullable: true
      description: "Data da próxima execução (YYYY-MM-DD)"
    active:
      type: boolean
      nullable: true
      description: "Filtrar por recorrências ativas"

UpdateRecurrenceRequest:
  type: object
  properties:
    description:
      type: string
      nullable: true
      description: "Descrição da recorrência"
    dayOfMonth:
      type: integer
      nullable: true
      description: "Dia do mês para a recorrência"
    endDate:
      type: string
      nullable: true
      description: "Data de término (YYYY-MM-DD)"
    active:
      type: boolean
      nullable: true
      description: "Se a recorrência está ativa"

Recurrence:
  type: object
  required:
    - id
    - description
    - amount
    - startDate
    - dayOfMonth
    - active
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: "Identificador único"
    clientId:
      type: string
      format: uuid
      nullable: true
      description: "ID do cliente"
    financialInstrumentId:
      type: string
      format: uuid
      nullable: true
      description: "ID do instrumento financeiro"
    description:
      type: string
      description: "Descrição da recorrência"
    category:
      $ref: "#/DebtCategory"
      nullable: true
      description: "Categoria da recorrência"
    amount:
      type: string
      description: "Valor da recorrência (Decimal)"
    startDate:
      type: string
      description: "Data de início (YYYY-MM-DD)"
    endDate:
      type: string
      nullable: true
      description: "Data de término (YYYY-MM-DD)"
    dayOfMonth:
      type: integer
      description: "Dia do mês para a recorrência"
    nextRunDate:
      type: string
      nullable: true
      description: "Data da próxima execução (YYYY-MM-DD)"
    active:
      type: boolean
      description: "Se a recorrência está ativa"
    createdAt:
      type: string
      description: "Data de criação (DateTime)"
    updatedAt:
      type: string
      nullable: true
      description: "Data de atualização (DateTime)"
