ListIncomesFilters:
  type: object
  properties:
    startDate:
      type: string
      description: "Data de início (formato: YYYY-MM-DD)"
    endDate:
      type: string
      description: "Data de fim (formato: YYYY-MM-DD)"

Income:
  type: object
  required:
    - id
    - clientId
    - accountId
    - description
    - amount
    - reference
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    clientId:
      type: string
      format: uuid
      description: "Client identifier"
    accountId:
      type: string
      format: uuid
    description:
      type: string
    amount:
      type: string
      description: "Decimal value as string"
    reference:
      type: string
      description: "Reference date (YYYY-MM-DD)"
    createdAt:
      type: string
      description: "DateTime string"
    updatedAt:
      type: string
      nullable: true
      description: "DateTime string"

CreateIncomeRequest:
  type: object
  required:
    - accountIdentification
    - description
    - amount
    - dateReference
  properties:
    accountIdentification:
      type: string
      description: "Account identification"
    description:
      type: string
      description: "Income description"
    amount:
      type: string
      description: "Decimal value as string"
    dateReference:
      type: string
      description: "Reference date (YYYY-MM-DD)"
