players:
  post:
    operationId: createPlayer
    summary: Cria um novo jogador
    tags:
      - Matchmaking
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/matchmaking.yaml#/CreatePlayerRequest"
    responses:
      "201":
        description: Jogador criado com sucesso
        content:
          application/json:
            schema:
              $ref: "../schemas/matchmaking.yaml#/Player"
  get:
    operationId: listPlayers
    summary: Lista todos os jogadores
    tags:
      - Matchmaking
    responses:
      "200":
        description: Lista de jogadores
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/matchmaking.yaml#/Player"

updatePlayer:
  patch:
    operationId: updatePlayer
    summary: Atualiza um jogador existente
    tags:
      - Matchmaking
    parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID do jogador a ser atualizado
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/matchmaking.yaml#/UpdatePlayerRequest"
    responses:
      "200":
        description: Jogador atualizado com sucesso
        content:
          application/json:
            schema:
              $ref: "../schemas/matchmaking.yaml#/Player"

sessions:
  post:
    operationId: createSession
    summary: Cria um novo dia de jogo
    tags:
      - Matchmaking
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/matchmaking.yaml#/CreateSessionRequest"
    responses:
      "201":
        description: Sessão criada com sucesso
        content:
          application/json:
            schema:
              $ref: "../schemas/matchmaking.yaml#/Session"
  get:
    operationId: listSessions
    summary: Lista todos os dias de jogo
    tags:
      - Matchmaking
    responses:
      "200":
        description: Lista de sessões
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/matchmaking.yaml#/Session"

session:
  get:
    operationId: getSession
    summary: Busca um dia de jogo pelo id
    tags:
      - Matchmaking
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Sessão encontrada
        content:
          application/json:
            schema:
              $ref: "../schemas/matchmaking.yaml#/Session"
  patch:
    operationId: updateSession
    summary: Atualiza um dia de jogo existente
    tags:
      - Matchmaking
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/matchmaking.yaml#/UpdateSessionRequest"
    responses:
      "200":
        description: Sessão atualizada com sucesso
        content:
          application/json:
            schema:
              $ref: "../schemas/matchmaking.yaml#/Session"

teams:
  post:
    operationId: createTeam
    summary: Cria manualmente uma dupla/time
    tags:
      - Matchmaking
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/matchmaking.yaml#/CreateTeamRequest"
    responses:
      "201":
        description: Time criado com sucesso
        content:
          application/json:
            schema:
              $ref: "../schemas/matchmaking.yaml#/Team"

deleteTeam:
  delete:
    operationId: discardDraft
    summary: Descarta um Draft que nunca foi iniciado
    description: >-
      Só se aplica a um time com status Draft. Os jogadores voltam pra fila
      da sessão.
    tags:
      - Matchmaking
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Draft descartado

teamsBySession:
  get:
    operationId: listTeams
    summary: Lista os times de uma sessão
    tags:
      - Matchmaking
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Lista de times
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/matchmaking.yaml#/Team"

updateTeam:
  patch:
    operationId: updateTeam
    summary: Atualiza a composição (jogadores) de um Draft antes de iniciar
    description: >-
      Só pode ser aplicado a um time Draft. Quem entra no roster sai da fila
      da sessão (ou, se estiver em outro Draft, esse Draft é desfeito); quem
      sai do roster volta pra fila.
    tags:
      - Matchmaking
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID do time a ser atualizado
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/matchmaking.yaml#/UpdateTeamRequest"
    responses:
      "200":
        description: Time atualizado com sucesso
        content:
          application/json:
            schema:
              $ref: "../schemas/matchmaking.yaml#/Team"

sessionQueue:
  get:
    operationId: getSessionQueue
    summary: Lista a fila de espera da sessão (jogadores individuais, já ordenada)
    tags:
      - Matchmaking
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Fila da sessão, na ordem de quem entra primeiro
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/matchmaking.yaml#/QueueEntry"

fillCourts:
  post:
    operationId: fillIdleCourts
    summary: Refaz o preenchimento das quadras ociosas sem um resultado pra reagir
    description: >-
      Roda a mesma varredura de "preencher quadras ociosas" do reportar
      resultado, mas sob demanda — pra quando as quadras estão ociosas com
      missingChallenger e não há partida em andamento pra disparar isso
      (ex.: jogadores chegaram atrasados e foram confirmados agora).
    tags:
      - Matchmaking
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Sugestões por quadra
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/matchmaking.yaml#/CourtSuggestion"

pinQueuePlayer:
  patch:
    operationId: setQueuePin
    summary: Fixa / desafixa um jogador no topo da fila
    tags:
      - Matchmaking
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: playerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/matchmaking.yaml#/SetPinRequest"
    responses:
      "200":
        description: Entrada da fila atualizada
        content:
          application/json:
            schema:
              $ref: "../schemas/matchmaking.yaml#/QueueEntry"

matches:
  post:
    operationId: createMatch
    summary: Inicia uma partida em uma quadra
    description: >-
      Só serve para ocupar uma quadra pela primeira vez; partidas seguintes
      naquela quadra são criadas automaticamente ao reportar o resultado da
      anterior (ver `reportMatchResult`).
    tags:
      - Matchmaking
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/matchmaking.yaml#/CreateMatchRequest"
    responses:
      "201":
        description: Partida iniciada com sucesso (sem resultado ainda)
        content:
          application/json:
            schema:
              $ref: "../schemas/matchmaking.yaml#/Match"

matchesBySession:
  get:
    operationId: listMatches
    summary: Lista as partidas registradas de uma sessão
    tags:
      - Matchmaking
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Lista de partidas
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/matchmaking.yaml#/Match"

matchResult:
  post:
    operationId: reportMatchResult
    summary: Reporta o resultado de uma partida em andamento
    description: >-
      Encerra a partida com o vencedor informado e aplica ao modelo de fila:
      o perdedor volta pra fila (games +1), o vencedor segura a quadra até o
      limite de vitórias seguidas, e cada quadra ociosa recebe um Draft
      desafiante sugerido da fila. NÃO inicia a próxima partida — a resposta
      traz as sugestões pro operador confirmar via createMatch.
    tags:
      - Matchmaking
    parameters:
      - name: matchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/matchmaking.yaml#/ReportMatchResultRequest"
    responses:
      "200":
        description: Resultado registrado; sugestões de desafiante por quadra
        content:
          application/json:
            schema:
              $ref: "../schemas/matchmaking.yaml#/ReportMatchResultResponse"
